apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudcart-blue
  labels:
    app: cloudcart
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudcart
      version: blue
  template:
    metadata:
      labels:
        app: cloudcart
        version: blue
    spec:
      containers:
        - name: cloudcart
          image: cloudcart:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
